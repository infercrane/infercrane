services:
  infercrane:
    environment:
      CLOUDSDK_CONFIG: /tmp/infercrane-gcloud
      INFERCRANE_GCLOUD_CONFIG_SOURCE: /run/infercrane/gcloud-bootstrap
      INFERCRANE_GCP_PROJECT: ${INFERCRANE_GCP_PROJECT:?set INFERCRANE_GCP_PROJECT}
      INFERCRANE_GCP_ZONE: ${INFERCRANE_GCP_ZONE:?set INFERCRANE_GCP_ZONE}
      INFERCRANE_GCP_SUBNET: ${INFERCRANE_GCP_SUBNET:?set INFERCRANE_GCP_SUBNET}
      INFERCRANE_GCP_MACHINE_TYPE: ${INFERCRANE_GCP_MACHINE_TYPE:?set INFERCRANE_GCP_MACHINE_TYPE}
      INFERCRANE_GCP_GPU: ${INFERCRANE_GCP_GPU:?set INFERCRANE_GCP_GPU}
      INFERCRANE_GCP_SERVICE_ACCOUNT: ${INFERCRANE_GCP_SERVICE_ACCOUNT:?set INFERCRANE_GCP_SERVICE_ACCOUNT}
      INFERCRANE_GCP_VM_IMAGE: ${INFERCRANE_GCP_VM_IMAGE:?set INFERCRANE_GCP_VM_IMAGE}
      INFERCRANE_GCP_CONTAINER_IMAGE: ${INFERCRANE_GCP_CONTAINER_IMAGE:?set INFERCRANE_GCP_CONTAINER_IMAGE}
      INFERCRANE_GCP_WORKER_SECRET: ${INFERCRANE_GCP_WORKER_SECRET:?set INFERCRANE_GCP_WORKER_SECRET}
      INFERCRANE_GCP_BOOT_DISK_GIB: ${INFERCRANE_GCP_BOOT_DISK_GIB:-200}
    volumes:
      - ${GCLOUD_CONFIG_DIR:?set GCLOUD_CONFIG_DIR}:/run/infercrane/gcloud-bootstrap:ro
