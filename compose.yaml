services:
  verifier:
    profiles: ["test"]
    build:
      context: .
      target: test

  test-postgres:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: infercrane_test
      POSTGRES_USER: infercrane
      POSTGRES_PASSWORD: infercrane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infercrane -d infercrane_test"]
      interval: 1s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  integration-test:
    profiles: ["test"]
    build:
      context: .
      target: builder
    entrypoint: ["go", "test"]
    # Database-backed packages share this intentionally ephemeral PostgreSQL
    # instance. Serialize packages so fixture truncation cannot race another
    # package while retaining per-package race detection and full coverage.
    command: ["-race", "-count=1", "-p=1", "./..."]
    environment:
      INFERCRANE_TEST_DATABASE_URL: postgres://infercrane:infercrane@test-postgres:5432/infercrane_test?sslmode=disable
    depends_on:
      test-postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: infercrane
      POSTGRES_USER: infercrane
      POSTGRES_PASSWORD: infercrane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infercrane -d infercrane"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  worker-a:
    build:
      context: .
      target: development
    entrypoint: ["fake-vllm"]
    command: ["--port", "8101", "--worker", "gpu-a"]

  worker-b:
    build:
      context: .
      target: development
    entrypoint: ["fake-vllm"]
    command: ["--port", "8102", "--worker", "gpu-b"]

  infercrane:
    build:
      context: .
      target: development
    entrypoint: ["infercrane-dev-start"]
    environment:
      INFERCRANE_API_KEY: infercrane
      INFERCRANE_DATABASE_URL: postgres://infercrane:infercrane@postgres:5432/infercrane?sslmode=disable
      INFERCRANE_INSTANCE_ID: compose-1
      INFERCRANE_ROUTER_BINARY: fake-router
    ports:
      - "${INFERCRANE_DEV_PORT:-18000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      worker-a:
        condition: service_started
      worker-b:
        condition: service_started

volumes:
  postgres-data:
