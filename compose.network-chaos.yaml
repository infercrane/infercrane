services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    ports:
      - "127.0.0.1:${INFERCRANE_TOXIPROXY_PORT:-18474}:8474"
    depends_on:
      postgres:
        condition: service_healthy

  infercrane:
    environment:
      INFERCRANE_DATABASE_URL: postgres://infercrane:infercrane@toxiproxy:15432/infercrane?sslmode=disable
    depends_on:
      toxiproxy:
        condition: service_started
