# Test-only contract subset derived from NVIDIA Dynamo's v1beta1 DGD CRD at
# upstream commit 004cd02b1aaba31c3579436d8cd07602644ed442 (2026-08-23).
# It intentionally validates the fields InferCrane owns while treating the
# Kubernetes PodTemplate as an embedded boundary. It proves discovery,
# admission, server-side apply, ownership, and deletion without pretending to
# run the Dynamo operator or a GPU workload.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dynamographdeployments.nvidia.com
spec:
  group: nvidia.com
  scope: Namespaced
  names:
    plural: dynamographdeployments
    singular: dynamographdeployment
    kind: DynamoGraphDeployment
    shortNames: [dgd]
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [backendFramework, components]
              properties:
                backendFramework:
                  type: string
                  enum: [vllm, sglang, trtllm]
                components:
                  type: array
                  maxItems: 25
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, type, runtimeVersionOverride, podTemplate]
                    properties:
                      name:
                        type: string
                        minLength: 1
                      type:
                        type: string
                        enum: [frontend, worker, prefill, decode, planner, epp]
                      replicas:
                        type: integer
                        minimum: 0
                      runtimeVersionOverride:
                        type: string
                        pattern: '^(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})\.(0|[1-9][0-9]{0,3})$'
                      podTemplate:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
