global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/rules/*.yaml]
scrape_configs:
  - job_name: infercrane
    static_configs: [{targets: ["host.docker.internal:19480"]}]
  - job_name: infercrane-results
    metrics_path: /api/v1/metrics
    authorization: {type: Bearer, credentials: fixture-key}
    static_configs: [{targets: ["host.docker.internal:19480"]}]
  - job_name: vllm
    metrics_path: /engine/metrics
    static_configs: [{targets: ["host.docker.internal:19480"]}]
