# Local preview of the InferCrane dashboard on sample data. No GPU, database,
# or control plane. Start the fixture first:
#   go run ./internal/testtools/grafana-fixture
#   docker compose -f internal/testtools/grafana-fixture/compose.yaml up
# Grafana: http://127.0.0.1:13000 (anonymous viewer). Prometheus: http://127.0.0.1:19090
name: infercrane-grafana-fixture
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=1d"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:19090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../../deploy/prometheus-rules.yaml:/etc/prometheus/rules/infercrane.yaml:ro
  grafana:
    image: grafana/grafana:12.1.0
    depends_on: [prometheus]
    ports: ["127.0.0.1:13000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/infercrane-dashboard.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../../deploy/grafana/infercrane-dashboard.json:/var/lib/grafana/dashboards/infercrane-dashboard.json:ro
