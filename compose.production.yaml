name: infercrane

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: infercrane
      POSTGRES_USER: infercrane
      POSTGRES_PASSWORD: ${INFERCRANE_POSTGRES_PASSWORD:?set INFERCRANE_POSTGRES_PASSWORD}
    healthcheck:
      # Avoid reporting healthy from PostgreSQL's temporary initialization
      # server, which only listens on the container's Unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U infercrane -d infercrane"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [control]

  infercrane:
    image: ${INFERCRANE_IMAGE:-ghcr.io/infercrane/infercrane:v2.0.0}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      INFERCRANE_ENV: production
      INFERCRANE_API_KEY: ${INFERCRANE_API_KEY:?set INFERCRANE_API_KEY}
      INFERCRANE_DATABASE_URL: postgres://infercrane:${INFERCRANE_POSTGRES_PASSWORD:?set INFERCRANE_POSTGRES_PASSWORD}@postgres:5432/infercrane?sslmode=disable
      INFERCRANE_URL: ${INFERCRANE_URL:?set INFERCRANE_URL}
      INFERCRANE_INSTANCE_ID: ${INFERCRANE_INSTANCE_ID:-compose-1}
    ports:
      - "${INFERCRANE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [control]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

networks:
  control:

volumes:
  postgres-data:
