name: infercrane

services:
  postgres:
    image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-euo", "pipefail", "-c"]
    command:
      - |
        install -d -m 0700 -o postgres -g postgres /var/lib/postgresql/tls
        if [ ! -s /var/lib/postgresql/tls/server.key ] || [ ! -s /var/lib/postgresql/tls/server.crt ]; then
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 3650 \
            -subj /CN=postgres -addext subjectAltName=DNS:postgres \
            -keyout /var/lib/postgresql/tls/server.key \
            -out /var/lib/postgresql/tls/server.crt
          chown postgres:postgres /var/lib/postgresql/tls/server.key /var/lib/postgresql/tls/server.crt
          chmod 0600 /var/lib/postgresql/tls/server.key
          chmod 0644 /var/lib/postgresql/tls/server.crt
        fi
        exec /usr/local/bin/docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/var/lib/postgresql/tls/server.crt \
          -c ssl_key_file=/var/lib/postgresql/tls/server.key
    environment:
      POSTGRES_DB: infercrane
      POSTGRES_USER: infercrane
      POSTGRES_PASSWORD: ${INFERCRANE_POSTGRES_PASSWORD:?set INFERCRANE_POSTGRES_PASSWORD}
    healthcheck:
      # Avoid reporting healthy from PostgreSQL's temporary initialization
      # server, which only listens on the container's Unix socket.
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=$$POSTGRES_PASSWORD psql 'host=127.0.0.1 user=infercrane dbname=infercrane sslmode=require' -c 'SELECT 1' >/dev/null",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-tls:/var/lib/postgresql/tls
    networks: [control]

  infercrane:
    image: ${INFERCRANE_IMAGE:-ghcr.io/infercrane/infercrane:v1.0.0}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      INFERCRANE_ENV: production
      INFERCRANE_API_KEY: ${INFERCRANE_API_KEY:?set INFERCRANE_API_KEY}
      INFERCRANE_DATABASE_URL: postgres://infercrane:${INFERCRANE_POSTGRES_PASSWORD:?set INFERCRANE_POSTGRES_PASSWORD}@postgres:5432/infercrane?sslmode=require
      INFERCRANE_URL: ${INFERCRANE_URL:?set INFERCRANE_URL}
      INFERCRANE_INSTANCE_ID: ${INFERCRANE_INSTANCE_ID:-compose-1}
    ports:
      - "${INFERCRANE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [control]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

networks:
  control:

volumes:
  postgres-data:
  postgres-tls:
