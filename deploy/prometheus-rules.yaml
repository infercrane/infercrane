groups:
  - name: infercrane
    rules:
      - alert: InferCraneGatewayErrorRateHigh
        expr: rate(infercrane_gateway_failures_total[5m]) / clamp_min(rate(infercrane_gateway_requests_total[5m]), 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: InferCrane gateway error rate exceeds 5%
      - alert: InferCraneGatewayLatencyHigh
        expr: histogram_quantile(0.95, rate(infercrane_gateway_request_duration_seconds_bucket[5m])) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: InferCrane p95 request duration exceeds 10 seconds
      - alert: InferCraneGatewayUnavailable
        expr: up{job="infercrane"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: InferCrane metrics endpoint is unavailable
  - name: infercrane-openrouter-provider
    interval: 30s
    rules:
      - record: infercrane_provider:productive_utilization_ratio_5m
        expr: |
          rate(infercrane_provider_productive_output_tokens_total[5m])
          / clamp_min(infercrane_provider_qualified_output_tokens_per_second, 0.001)
      - record: infercrane_provider:request_failure_ratio_5m
        expr: |
          rate(infercrane_provider_requests_failed_total[5m])
          / clamp_min(rate(infercrane_provider_requests_completed_total[5m]), 0.001)
      - record: infercrane_provider:ttft_slo_miss_ratio_5m
        expr: |
          rate(infercrane_provider_ttft_slo_missed_total[5m])
          / clamp_min(rate(infercrane_provider_requests_completed_total[5m]), 0.001)
      - record: infercrane_provider:prefill_rejection_ratio_5m
        expr: |
          rate(infercrane_provider_prefill_rejected_total[5m])
          / clamp_min(rate(infercrane_provider_requests_accepted_total[5m]) + rate(infercrane_provider_requests_rejected_total[5m]), 0.001)
      - record: infercrane_provider:gross_margin_ratio_1h
        expr: |
          (
            rate(infercrane_provider_revenue_usd_total[1h])
            - infercrane_provider_gpu_hourly_cost_usd / 3600
          )
          / clamp_min(rate(infercrane_provider_revenue_usd_total[1h]), 0.000000001)
      - alert: InferCraneProviderFailureRateHigh
        expr: infercrane_provider:request_failure_ratio_5m > 0.01
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: OpenRouter provider failure rate exceeds 1%
      - alert: InferCraneProviderTTFTSLOMissHigh
        expr: infercrane_provider:ttft_slo_miss_ratio_5m > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: OpenRouter provider TTFT SLO miss rate exceeds 5%
      - alert: InferCraneProviderCapacityCalibrationStale
        expr: infercrane_provider:productive_utilization_ratio_5m > 1.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Productive token rate exceeds the qualified capacity by more than 10%
  # Results of the authenticated workspace scrape (GET /api/v1/metrics).
  # deploy/grafana/prometheus-scrape.yaml shows the scrape job. The counters
  # count stored records, so increase() fires once per new record and never
  # on a restart of the control plane.
  - name: infercrane-results
    rules:
      - alert: InferCraneReleaseGuardBlocked
        expr: sum by (deployment) (increase(infercrane_release_guard_quality_verdicts_total{verdict="BLOCK"}[15m])) > 0
        labels:
          severity: critical
        annotations:
          summary: Release Guard blocked a candidate of {{ $labels.deployment }} on answer quality
          description: >-
            The latest Release Guard evaluation of {{ $labels.deployment }} gave a BLOCK quality verdict,
            so the candidate was rejected and production traffic did not move. Run
            `infercrane rollout inspect {{ $labels.deployment }}` for the failing eval and its scores.
      - alert: InferCraneReleaseGuardRejected
        expr: sum by (deployment) (increase(infercrane_release_guard_decisions_total{decision="REJECT"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Release Guard rejected a candidate of {{ $labels.deployment }}
          description: >-
            A measured regression, failed readiness, or a compatibility mismatch rejected the candidate.
            Production traffic did not move. Run `infercrane rollout inspect {{ $labels.deployment }}`.
      - alert: InferCraneQualityWatch
        expr: sum by (deployment) (increase(infercrane_release_guard_quality_verdicts_total{verdict="WATCH"}[15m])) > 0
        labels:
          severity: info
        annotations:
          summary: Answer quality of {{ $labels.deployment }} dropped inside the watch band
          description: The candidate was accepted with a WATCH verdict that records a follow-up.
      - alert: InferCraneRolledBack
        expr: sum by (deployment, trigger) (increase(infercrane_rollbacks_total[15m])) > 0
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.deployment }} rolled back to its retained revision ({{ $labels.trigger }})'
          description: >-
            automatic: the post-promotion observation found a regression and restored the retained
            revision. operator: someone ran rollout rollback. Run `infercrane explain rollout {{ $labels.deployment }}`.
      - alert: InferCraneEndpointGuardRejected
        expr: sum by (endpoint) (increase(infercrane_endpoint_guard_decisions_total{decision="REJECT"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Endpoint Release Guard rejected a candidate serving plan of {{ $labels.endpoint }}
      - alert: InferCraneResultsScrapeFailing
        expr: up{job="infercrane-results"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Prometheus cannot read InferCrane results
          description: >-
            The workspace scrape failed for 10 minutes, so Release Guard and rollback alerts cannot fire.
            Check the API key and that it has read permission.
