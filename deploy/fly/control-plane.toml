# Deploy with an explicit application name:
#   fly deploy -a YOUR_APP_NAME -c deploy/fly/control-plane.toml
# Secrets are configured with `fly secrets set`; never add them here.

primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 35

[build]
  # Fly resolves this path relative to this configuration file, while the
  # build context remains the repository root used by `fly deploy`.
  dockerfile = "../../Dockerfile"
  build-target = "runtime"

[env]
  INFERCRANE_ENV = "production"
  INFERCRANE_HOST = "0.0.0.0"
  INFERCRANE_PORT = "8080"
  INFERCRANE_HOSTED_AUTH_AUTO_PROVISION = "true"
  # SkyPilot starts a local API process. Keep the provider list credential-gated
  # and give the machine enough memory for the control plane plus that process.
  INFERCRANE_SKYPILOT_API = "auto"
  SKYPILOT_DISABLE_USAGE_COLLECTION = "1"
  # Provider-native price feeds rotate exact marketplace shards while staying
  # below provider request budgets. This is observation, not capacity polling.
  INFERCRANE_GPU_PRICE_SYNC_SECONDS = "75"
  INFERCRANE_DATABASE_MAX_OPEN = "12"
  INFERCRANE_DATABASE_MAX_IDLE = "4"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  # SkyPilot recommends at least 2 GiB for its local API server. The production
  # readiness check is not considered healthy until both processes have started.
  memory = "2gb"
  processes = ["app"]
