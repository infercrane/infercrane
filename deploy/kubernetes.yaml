apiVersion: v1
kind: Service
metadata:
  name: infercrane
spec:
  selector: {app.kubernetes.io/name: infercrane}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infercrane
spec:
  replicas: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app.kubernetes.io/name: infercrane}
  template:
    metadata:
      labels: {app.kubernetes.io/name: infercrane}
    spec:
      terminationGracePeriodSeconds: 45
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: infercrane
          image: ghcr.io/infercrane/infercrane:REPLACE_WITH_IMMUTABLE_TAG
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: INFERCRANE_HOST, value: 0.0.0.0}
            - name: INFERCRANE_INSTANCE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: INFERCRANE_DATABASE_URL
              valueFrom: {secretKeyRef: {name: infercrane, key: database-url}}
            - name: INFERCRANE_API_KEY
              valueFrom: {secretKeyRef: {name: infercrane, key: api-key}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /livez, port: http}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          startupProbe: {httpGet: {path: /livez, port: http}, periodSeconds: 2, failureThreshold: 30}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 1Gi}}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: infercrane
spec:
  minAvailable: 2
  selector:
    matchLabels: {app.kubernetes.io/name: infercrane}
