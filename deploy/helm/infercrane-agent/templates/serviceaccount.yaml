{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "infercrane-agent.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infercrane-agent.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The agent needs the API only for candidate runs.
automountServiceAccountToken: {{ .Values.executor.enabled }}
{{- end }}
{{- if and .Values.executor.enabled .Values.executor.runtimeServiceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.executor.runtimeServiceAccount.name }}
  namespace: {{ include "infercrane-agent.executorNamespace" . }}
  labels:
    {{- include "infercrane-agent.labels" . | nindent 4 }}
# Candidate model servers never call the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
