{{- if not .Values.agent.hashKeySecret.name }}
{{- $name := include "infercrane-agent.hashKeySecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infercrane-agent.labels" . | nindent 4 }}
  annotations:
    # Keep the key when the release is removed, so hashes stay comparable.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (index $existing.data .Values.agent.hashKeySecret.key) }}
  {{ .Values.agent.hashKeySecret.key }}: {{ index $existing.data .Values.agent.hashKeySecret.key }}
  {{- else }}
  {{ .Values.agent.hashKeySecret.key }}: {{ printf "%s%s" (randAlphaNum 32 | sha256sum | trunc 32) (randAlphaNum 32 | sha256sum | trunc 32) | b64enc }}
  {{- end }}
{{- end }}
{{- if and .Values.executor.enabled (not .Values.executor.workerSecret.name) }}
{{- $name := include "infercrane-agent.workerSecret" . }}
{{- $existing := lookup "v1" "Secret" (include "infercrane-agent.executorNamespace" .) $name }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ include "infercrane-agent.executorNamespace" . }}
  labels:
    {{- include "infercrane-agent.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $existing (index $existing.data .Values.executor.workerSecret.key) }}
  {{ .Values.executor.workerSecret.key }}: {{ index $existing.data .Values.executor.workerSecret.key }}
  {{- else }}
  {{ .Values.executor.workerSecret.key }}: {{ randAlphaNum 40 | b64enc }}
  {{- end }}
{{- end }}
{{- if .Values.executor.evalSets }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "infercrane-agent.fullname" . }}-eval-sets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infercrane-agent.labels" . | nindent 4 }}
data:
  {{- range $name, $body := .Values.executor.evalSets }}
  {{ $name }}.json: {{ $body | toJson | quote }}
  {{- end }}
{{- end }}
{{- if .Values.controlPlane.caBundle }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "infercrane-agent.fullname" . }}-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "infercrane-agent.labels" . | nindent 4 }}
data:
  ca.crt: {{ .Values.controlPlane.caBundle | quote }}
{{- end }}
