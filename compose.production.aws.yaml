services:
  infercrane:
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-default}
      INFERCRANE_AWS_ROLE_ARN: ${INFERCRANE_AWS_ROLE_ARN:?set INFERCRANE_AWS_ROLE_ARN}
      INFERCRANE_AWS_EXTERNAL_ID: ${INFERCRANE_AWS_EXTERNAL_ID:?set INFERCRANE_AWS_EXTERNAL_ID}
      INFERCRANE_AWS_REGION: ${INFERCRANE_AWS_REGION:?set INFERCRANE_AWS_REGION}
      INFERCRANE_AWS_SUBNET_ID: ${INFERCRANE_AWS_SUBNET_ID:-}
      INFERCRANE_AWS_SUBNET_IDS: ${INFERCRANE_AWS_SUBNET_IDS:-}
      INFERCRANE_AWS_SECURITY_GROUP_IDS: ${INFERCRANE_AWS_SECURITY_GROUP_IDS:?set INFERCRANE_AWS_SECURITY_GROUP_IDS}
      INFERCRANE_AWS_AMI_ID: ${INFERCRANE_AWS_AMI_ID:?set INFERCRANE_AWS_AMI_ID}
      INFERCRANE_AWS_INSTANCE_TYPE: ${INFERCRANE_AWS_INSTANCE_TYPE:?set INFERCRANE_AWS_INSTANCE_TYPE}
      INFERCRANE_AWS_GPU: ${INFERCRANE_AWS_GPU:?set INFERCRANE_AWS_GPU}
      INFERCRANE_AWS_INSTANCE_PROFILE_ARN: ${INFERCRANE_AWS_INSTANCE_PROFILE_ARN:?set INFERCRANE_AWS_INSTANCE_PROFILE_ARN}
      INFERCRANE_AWS_WORKER_SECRET_ARN: ${INFERCRANE_AWS_WORKER_SECRET_ARN:?set INFERCRANE_AWS_WORKER_SECRET_ARN}
      INFERCRANE_AWS_IMAGE_DIGEST: ${INFERCRANE_AWS_IMAGE_DIGEST:?set INFERCRANE_AWS_IMAGE_DIGEST}
      INFERCRANE_AWS_IMAGE_CACHE_POLICY: ${INFERCRANE_AWS_IMAGE_CACHE_POLICY:-prefer}
      INFERCRANE_AWS_ROOT_VOLUME_GIB: ${INFERCRANE_AWS_ROOT_VOLUME_GIB:-100}
    volumes:
      - ${AWS_CONFIG_DIR:?set AWS_CONFIG_DIR}:/home/app/.aws:ro
