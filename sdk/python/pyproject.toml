[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "infercrane"
version = "1.0.0"
description = "Typed Python client for the InferCrane inference control plane"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Yasin Toy and InferCrane contributors"}]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Documentation = "https://docs.infercrane.com"
Repository = "https://github.com/infercrane/infercrane"
Issues = "https://github.com/infercrane/infercrane/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/infercrane"]
