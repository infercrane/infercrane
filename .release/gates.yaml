schema_version: 1

milestone_gates:
  required:
    - formatting
    - static_analysis
    - unit_tests
    - api_cli_tests
    - database_migration_tests
    - provider_runtime_contracts
    - deterministic_provider_simulation
    - fault_injection
    - docker_compose_integration
    - security_dependency_checks
    - documentation_drift
    - clean_tree_local_qualification
    - previous_milestone_regression
    - openapi_route_and_generation_drift
    - python_sdk_package_and_stack_smoke
    - typescript_sdk_package_and_stack_smoke
    - terraform_protocol_crud_import_and_adoption
    - github_delivery_plan_and_release_check
    - embedded_dashboard_security_and_structure
    - authenticated_dashboard_docker_smoke
    - dashboard_responsive_accessibility_contract
    - immutable_oci_workload_validation
    - portable_runtime_provider_translation
    - sglang_runtime_conformance
    - runtime_compatibility_matrix
    - portable_runtime_api_sdk_and_spec_drift
    - deterministic_recommendation_provenance
    - slo_policy_fail_closed_evaluation
    - capacity_evidence_freshness_and_compatibility
    - hybrid_overflow_oscillation_and_budget_simulation
    - recommendation_api_cli_sdk_dashboard_drift
    - inference_decision_migration_and_tenant_isolation
    - release_guard_v2_compatibility_synthetic_and_sourced_cost
    - bounded_explicit_aiperf_validation_without_shadow_traffic
    - durable_post_promotion_monitor_and_automatic_rollback
    - inference_passport_canonical_signature_and_tamper_detection
    - inference_passport_migration_byte_preservation_and_tenant_isolation
    - passport_api_cli_sdk_dashboard_and_github_release_check_drift
  deferred_until_v1_manual_qualification:
    - runpod_elastic
    - runpod_serverless
    - aws_byoc
    - real_vllm
    - real_sglang
    - real_custom_oci
    - real_paid_cost_accounting

tag_policy:
  format: "v<major>.<minor>.<patch>-rc.1"
  annotated: true
  require_clean_tree: true
  require_required_gates: true
  stable_tags: forbidden
  remote_push: forbidden
  package_publication: forbidden

documentation_gate:
  same_milestone: true
  reject_undocumented_public_change: true
  verify:
    - mintlify_navigation
    - internal_links
    - cli_command_tree
    - deployment_spec
    - control_api_openapi
    - sdk_exports_when_present
    - provider_capability_registry
    - runtime_capability_registry
    - compatibility_matrix
    - migration_upgrade_guides
    - project_status
  rules:
    - primary product prose remains provider-neutral
    - provider details live in provider pages
    - commands and examples reflect executable behavior
    - planned experimental deferred and qualified states are explicit
    - simulated evidence is never described as real qualification

safety:
  paid_resources: forbidden_during_implementation
  secrets_in_evidence: forbidden
  weaken_gate_to_pass: forbidden
  prompt_output_content_by_default: forbidden
  external_fallback_requires:
    - explicit_opt_in
    - persisted_policy
    - hard_budget
    - privacy_disclosure
    - deterministic_explanation
