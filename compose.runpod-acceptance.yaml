services:
  credential-init:
    build:
      context: .
      target: runtime
    user: root
    environment:
      HOME: /home/app
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        rm -f /home/app/.runpod/config.toml
        runpod config "$$(cat /runpod-key)" >/dev/null
        mkdir -p /home/app/.sky
        chown -R 10001:10001 /home/app/.runpod /home/app/.sky
    volumes:
      - ${RUNPOD_KEY_FILE:?set RUNPOD_KEY_FILE}:/runpod-key:ro
      - runpod-config:/home/app/.runpod
      - skypilot-state:/home/app/.sky

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: infercrane_acceptance
      POSTGRES_USER: infercrane
      POSTGRES_PASSWORD: infercrane
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U infercrane -d infercrane_acceptance"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  runpod-fault-proxy:
    build:
      context: .
      target: acceptance
    entrypoint: ["/usr/local/bin/runpod-fault-proxy"]
    environment:
      RUNPOD_PROXY_DROP_FIRST_CREATE_RESPONSE: ${INFERCRANE_ACCEPTANCE_DROP_SERVERLESS_CREATE_RESPONSE:-0}

  infercrane:
    build:
      context: .
      target: runtime
    environment:
      INFERCRANE_API_KEY: infercrane-runpod-acceptance-key
      INFERCRANE_DATABASE_URL: postgres://infercrane:infercrane@postgres:5432/infercrane_acceptance?sslmode=disable
      INFERCRANE_ENV: test
      INFERCRANE_INSTANCE_ID: runpod-acceptance
      INFERCRANE_ROUTER_BINARY: vllm-router
      RUNPOD_API_KEY_FILE: /runpod-key
      INFERCRANE_RUNPOD_SERVERLESS_TEMPLATE_ID: ${INFERCRANE_RUNPOD_SERVERLESS_TEMPLATE_ID:-}
      INFERCRANE_RUNPOD_REST_URL: http://runpod-fault-proxy:8090/v1
      INFERCRANE_RUNPOD_CONTAINER_DISK_GIB: ${INFERCRANE_RUNPOD_CONTAINER_DISK_GIB:-100}
    ports:
      - "${INFERCRANE_ACCEPTANCE_PORT:-18001}:8080"
    volumes:
      - ${RUNPOD_KEY_FILE:?set RUNPOD_KEY_FILE}:/runpod-key:ro
      - runpod-config:/home/app/.runpod
      - skypilot-state:/home/app/.sky
    depends_on:
      credential-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      runpod-fault-proxy:
        condition: service_started

volumes:
  postgres-data:
  runpod-config:
  skypilot-state:
