[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infercrane"
version = "0.1.0"
description = "Open-source inference deployment control plane"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6,<7",
  "rich>=14,<15",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "openai>=1,<3",
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
]
skypilot = ["skypilot[runpod]>=0.13,<0.14"]
router = ["vllm-router==0.1.15"]

[project.scripts]
infercrane = "infercrane.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/infercrane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"src/infercrane/dev/*" = ["S104"]
