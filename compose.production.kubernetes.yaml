services:
  infercrane:
    environment:
      KUBECONFIG: /run/secrets/kubeconfig
      INFERCRANE_KUBERNETES_CONTEXT: ${INFERCRANE_KUBERNETES_CONTEXT:?set INFERCRANE_KUBERNETES_CONTEXT}
      INFERCRANE_KUBERNETES_NAMESPACE: ${INFERCRANE_KUBERNETES_NAMESPACE:-infercrane-system}
      INFERCRANE_KUBERNETES_WORKLOAD_API: ${INFERCRANE_KUBERNETES_WORKLOAD_API:-deployment}
      INFERCRANE_KUBERNETES_SERVICE_ACCOUNT: ${INFERCRANE_KUBERNETES_SERVICE_ACCOUNT:-infercrane-runtime}
      INFERCRANE_KUBERNETES_WORKER_SECRET_NAME: ${INFERCRANE_KUBERNETES_WORKER_SECRET_NAME:-infercrane-worker}
      INFERCRANE_KUBERNETES_WORKER_SECRET_KEY: ${INFERCRANE_KUBERNETES_WORKER_SECRET_KEY:-api-key}
      INFERCRANE_KUBERNETES_IMAGE_DIGEST: ${INFERCRANE_KUBERNETES_IMAGE_DIGEST:?set INFERCRANE_KUBERNETES_IMAGE_DIGEST}
      INFERCRANE_KUBERNETES_GPU_RESOURCE: ${INFERCRANE_KUBERNETES_GPU_RESOURCE:-nvidia.com/gpu}
      INFERCRANE_KUBERNETES_GPU_PRODUCT_LABEL: ${INFERCRANE_KUBERNETES_GPU_PRODUCT_LABEL:-nvidia.com/gpu.product}
      INFERCRANE_KUBERNETES_IMAGE_CACHE_POLICY: ${INFERCRANE_KUBERNETES_IMAGE_CACHE_POLICY:-prefer}
    volumes:
      - ${KUBECONFIG_FILE:?set KUBECONFIG_FILE}:/run/secrets/kubeconfig:ro
