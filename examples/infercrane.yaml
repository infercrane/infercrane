apiVersion: infercrane.dev/v1
kind: Deployment
name: qwen-prod
endpoint: support-production

model:
  id: Qwen/Qwen3-8B
  revision: main

runtime:
  engine: vllm
  version: 0.22.1
  args:
    - --enable-prefix-caching

compute:
  mode: elastic

resources:
  gpu: A40

provider:
  cloud: runpod

scaling:
  min_replicas: 1
  max_replicas: 1

routing:
  strategy: cache-aware
