apiVersion: infercrane.dev/v1
kind: Deployment
name: qwen-gcp
model:
  id: Qwen/Qwen3-8B
runtime:
  engine: vllm
  # A 24 GB L4 can't hold the model's full context.
  args:
    - --max-model-len
    - "8192"
compute:
  mode: elastic
provider:
  cloud: gcp
  adapter: gcp-compute
  region: europe-west4
resources:
  gpu: nvidia-l4
scaling:
  min_replicas: 1
  max_replicas: 1
routing:
  strategy: round-robin
