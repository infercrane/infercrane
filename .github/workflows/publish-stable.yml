name: publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact candidate or stable tag already built as a draft release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publication-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      npm_version: ${{ steps.packages.outputs.npm_version }}
      python_version: ${{ steps.packages.outputs.python_version }}
      pypi_exists: ${{ steps.packages.outputs.pypi_exists }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Refuse an unprotected or mismatched publication
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_SECURITY_READ_TOKEN: ${{ secrets.ORG_SECURITY_READ_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          candidate_tag=$(jq -er '.candidate_tag' .release/version.json)
          stable_tag=$(jq -er '.stable_tag' .release/version.json)
          case "$RELEASE_TAG" in
            "$candidate_tag") prerelease=true ;;
            "$stable_tag") prerelease=false ;;
            *) echo "publication tag must be $candidate_tag or $stable_tag" >&2; exit 1 ;;
          esac
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = public
          test -n "$ORG_SECURITY_READ_TOKEN"
          org_2fa=$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $ORG_SECURITY_READ_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/orgs/$GITHUB_REPOSITORY_OWNER" | \
            jq -er '.two_factor_requirement_enabled')
          test "$org_2fa" = true
          gh api "repos/$GITHUB_REPOSITORY/environments/stable-publication" \
            --jq 'select((.protection_rules | length) > 0)' >/dev/null
          actual=$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName)
          test "$(printf '%s' "$actual" | jq -r .isDraft)" = true
          test "$(printf '%s' "$actual" | jq -r .isPrerelease)" = "$prerelease"
          test "$(printf '%s' "$actual" | jq -r .tagName)" = "$RELEASE_TAG"
      - name: Download and verify the exact draft assets
        id: packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir publication-assets
          gh release download "$RELEASE_TAG" --dir publication-assets
          ./scripts/verify-release-artifacts.sh publication-assets "$RELEASE_TAG"
          test -f publication-assets/infercrane.rb
          stable_version=$(jq -er '.version' .release/version.json)
          if [ "$RELEASE_TAG" = "$(jq -er '.candidate_tag' .release/version.json)" ]; then
            npm_version=${RELEASE_TAG#v}
            python_version=${stable_version}rc${npm_version##*.}
          else
            npm_version=$stable_version
            python_version=$stable_version
          fi
          echo "npm_version=$npm_version" >>"$GITHUB_OUTPUT"
          echo "python_version=$python_version" >>"$GITHUB_OUTPUT"
          wheel="publication-assets/infercrane-${python_version}-py3-none-any.whl"
          npm_package="publication-assets/infercrane-sdk-${npm_version}.tgz"
          ./scripts/verify-sdk-artifacts.sh publication-assets "$npm_version" verify "$python_version"
          ./scripts/verify-terraform-release-artifacts.sh publication-assets "$RELEASE_TAG"
          for artifact in \
            publication-assets/infercrane_*.tar.gz \
            publication-assets/infercrane_*.tar.gz.sbom.json \
            publication-assets/checksums.txt \
            publication-assets/infercrane.rb \
            "$wheel" \
            "$npm_package" \
            publication-assets/sdk-checksums.txt \
            publication-assets/terraform-provider-infercrane_*.zip \
            publication-assets/terraform-provider-infercrane_*_SHA256SUMS; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$(git rev-parse HEAD)" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --deny-self-hosted-runners >/dev/null
          done
          mkdir -p publication-assets/python publication-assets/npm publication-assets/homebrew
          cp "$wheel" publication-assets/python/
          cp "$npm_package" publication-assets/npm/
          cp publication-assets/infercrane.rb publication-assets/homebrew/
          pypi_response=$(mktemp)
          pypi_status=$(curl --silent --show-error --output "$pypi_response" --write-out '%{http_code}' \
            "https://pypi.org/pypi/infercrane/$python_version/json")
          case "$pypi_status" in
            200)
              expected=$(sha256sum "$wheel" | cut -d' ' -f1)
              actual=$(jq -er --arg filename "$(basename "$wheel")" \
                '.urls[] | select(.filename == $filename) | .digests.sha256' "$pypi_response")
              test "$actual" = "$expected"
              echo "pypi_exists=true" >>"$GITHUB_OUTPUT"
              ;;
            404) echo "pypi_exists=false" >>"$GITHUB_OUTPUT" ;;
            *) echo "PyPI returned HTTP $pypi_status" >&2; cat "$pypi_response" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-publication-assets
          path: publication-assets
          if-no-files-found: error

  pypi:
    needs: preflight
    runs-on: ubuntu-latest
    environment: stable-publication
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-publication-assets
          path: publication-assets
      - name: Publish the exact wheel with PyPI Trusted Publishing
        if: needs.preflight.outputs.pypi_exists != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: publication-assets/python
          attestations: true
      - name: Confirm the exact wheel is already on PyPI
        if: needs.preflight.outputs.pypi_exists == 'true'
        run: echo "PyPI already contains the attested wheel with the same SHA-256 digest."

  npm:
    needs: preflight
    runs-on: ubuntu-latest
    environment: stable-publication
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-publication-assets
          path: publication-assets
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.20.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install the pinned trusted-publishing npm client
        run: |
          npm install --global npm@12.0.2
          test "$(npm --version)" = 12.0.2
      - name: Publish the exact package with npm Trusted Publishing
        env:
          NPM_VERSION: ${{ needs.preflight.outputs.npm_version }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          package=publication-assets/npm/infercrane-sdk-${NPM_VERSION}.tgz
          if npm view "@infercrane/sdk@${NPM_VERSION}" version >/dev/null 2>&1; then
            mkdir registry-package expected-package
            npm pack "@infercrane/sdk@${NPM_VERSION}" --pack-destination registry-package >/dev/null
            tar -xzf "$package" -C expected-package
            tar -xzf registry-package/*.tgz -C registry-package
            diff -qr expected-package/package registry-package/package
            echo "npm already contains the exact package contents."
          elif [ "$PRERELEASE" = true ]; then
            npm publish "$package" --access public --tag rc
          else
            npm publish "$package" --access public --tag latest
          fi

  homebrew:
    needs: preflight
    runs-on: ubuntu-latest
    environment: stable-publication
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-publication-assets
          path: publication-assets
      - name: Update the InferCrane Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh repo clone infercrane/homebrew-tap "$RUNNER_TEMP/homebrew-tap"
          mkdir -p "$RUNNER_TEMP/homebrew-tap/Formula"
          cp publication-assets/homebrew/infercrane.rb "$RUNNER_TEMP/homebrew-tap/Formula/infercrane.rb"
          cd "$RUNNER_TEMP/homebrew-tap"
          ruby -c Formula/infercrane.rb
          if [ -z "$(git status --porcelain -- Formula/infercrane.rb)" ]; then
            echo "Homebrew tap already contains the exact formula."
            exit 0
          fi
          git config user.name infercrane-release[bot]
          git config user.email 226962259+infercrane-release[bot]@users.noreply.github.com
          git add Formula/infercrane.rb
          git commit -s -m "infercrane: ${RELEASE_TAG}"
          git push origin HEAD:main

  finalize:
    needs: [preflight, pypi, npm, homebrew]
    runs-on: ubuntu-latest
    environment: stable-publication
    permissions:
      contents: write
    steps:
      - name: Publish the already-verified GitHub draft last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ needs.preflight.outputs.prerelease }}" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false \
              --title "InferCrane $RELEASE_TAG — Public Beta"
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest \
              --title "InferCrane $RELEASE_TAG"
          fi
