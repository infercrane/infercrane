name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.12.7
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan release artifacts
        uses: anchore/scan-action@v7
        with:
          path: dist
          fail-build: true
          severity-cutoff: critical
          output-format: table

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/infercrane/infercrane:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - name: Record immutable image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ghcr.io/infercrane/infercrane:${{ github.ref_name }}
        run: |
          test -n "$IMAGE_DIGEST"
          printf '%s@%s\n' "$IMAGE_TAG" "$IMAGE_DIGEST" > image-digest.txt
      - uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ github.ref_name }}
          path: image-digest.txt
          if-no-files-found: error
      - name: Scan published image by digest
        uses: anchore/scan-action@v7
        with:
          image: ghcr.io/infercrane/infercrane@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          fail-build: true
          severity-cutoff: critical
          output-format: table
