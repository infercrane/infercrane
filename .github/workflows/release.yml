name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: infercrane_test
          POSTGRES_USER: infercrane
          POSTGRES_PASSWORD: infercrane
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U infercrane -d infercrane_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      INFERCRANE_TEST_DATABASE_URL: postgres://infercrane:infercrane@127.0.0.1:5432/infercrane_test?sslmode=disable
      INFERCRANE_API_KEY: release-ci-only
      INFERCRANE_INSTANCE_ID: release-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            sdk/typescript/package-lock.json
      - name: Install documentation dependencies
        run: npm ci --prefix docs --no-audit --no-fund
      - name: Check Python SDK formatting and lint
        run: |
          python -m pip install --disable-pip-version-check ruff==0.12.0
          ruff format --check sdk/python/src/infercrane/client.py sdk/python/src/infercrane/errors.py sdk/python/src/infercrane/__init__.py sdk/python/tests
          ruff check sdk/python/src/infercrane/client.py sdk/python/src/infercrane/errors.py sdk/python/src/infercrane/__init__.py sdk/python/tests
      - name: Verify the release tag matches the source contract
        run: |
          candidate_tag=$(jq -r '.candidate_tag' .release/version.json)
          stable_tag=$(jq -r '.stable_tag' .release/version.json)
          case "$GITHUB_REF_NAME" in
            "$candidate_tag"|"$stable_tag") ;;
            *)
              echo "release tag $GITHUB_REF_NAME does not match $candidate_tag or $stable_tag" >&2
              exit 1
              ;;
          esac
      - name: Verify repository and automation packages
        run: ./scripts/verify-repository.sh
      - name: Validate documentation and links
        run: npm run check --prefix docs

  artifacts:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.12.7
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate and verify the Homebrew formula
        run: |
          ./scripts/generate-homebrew-formula.sh dist "$GITHUB_REF_NAME"
          ./scripts/verify-release-artifacts.sh dist "$GITHUB_REF_NAME"
      - name: Scan release artifacts
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          path: dist
          fail-build: true
          severity-cutoff: critical
          output-format: table
      - name: Attach the generated Homebrew formula to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/homebrew/infercrane.rb --clobber
      - name: Attest release archives, checksums, SBOMs, and formula
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/infercrane_*.tar.gz
            dist/infercrane_*.tar.gz.sbom.json
            dist/checksums.txt
            dist/homebrew/infercrane.rb

  sdk-packages:
    if: ${{ !contains(github.ref_name, '-rc.') }}
    needs: [preflight, artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Verify generated clients and package contracts
        run: ./scripts/test-automation-clients.sh quick
      - name: Build Python wheel
        run: python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir "$RUNNER_TEMP/sdk-dist" ./sdk/python
      - name: Build TypeScript package
        run: |
          npm --prefix sdk/typescript ci --no-audit --no-fund
          npm --prefix sdk/typescript test
          cd sdk/typescript
          npm pack --pack-destination "$RUNNER_TEMP/sdk-dist"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-packages-${{ github.ref_name }}
          path: ${{ runner.temp }}/sdk-dist/*
          if-no-files-found: error
      - name: Attach SDK packages to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/sdk-dist/"* --clobber

  image:
    needs: [preflight, artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          build-args: |
            INFERCRANE_VERSION=${{ github.ref_name }}
          push: true
          tags: ghcr.io/infercrane/infercrane:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - name: Record immutable image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ghcr.io/infercrane/infercrane:${{ github.ref_name }}
        run: |
          test -n "$IMAGE_DIGEST"
          printf '%s@%s\n' "$IMAGE_TAG" "$IMAGE_DIGEST" > image-digest.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-digest-${{ github.ref_name }}
          path: image-digest.txt
          if-no-files-found: error
      - name: Scan published image by digest
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: ghcr.io/infercrane/infercrane@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          fail-build: true
          severity-cutoff: critical
          output-format: table
      - name: Attest the published image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/infercrane/infercrane
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
