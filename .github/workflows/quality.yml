name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: infercrane_test
          POSTGRES_USER: infercrane
          POSTGRES_PASSWORD: infercrane
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U infercrane -d infercrane_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      INFERCRANE_TEST_DATABASE_URL: postgres://infercrane:infercrane@127.0.0.1:5432/infercrane_test?sslmode=disable
      INFERCRANE_API_KEY: ci-only
      INFERCRANE_INSTANCE_ID: ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: go mod download
      - run: make verify
      - run: go test -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  production-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          tags: infercrane:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  developer-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - run: npm ci
        working-directory: docs
      - run: make dev-check-full
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: developer-check-${{ github.run_id }}
          path: .infercrane/dev-check
          if-no-files-found: error

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golang/govulncheck-action@v1
        with:
          go-package: ./...

  dead-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/tools/cmd/deadcode@v0.48.0
      - run: make deadcode
