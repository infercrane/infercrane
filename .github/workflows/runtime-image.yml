name: Runtime image

on:
  workflow_dispatch:
    inputs:
      vllm_version:
        description: Pinned vLLM version
        required: true
        default: 0.22.0
      vllm_base_image:
        description: Immutable vllm/vllm-openai base image including sha256 digest
        required: true
        default: vllm/vllm-openai@sha256:0fec7ec5f3e6bc168e54899935fb0557da908a4832a1dbc88e2debcf2f889416
  push:
    branches: [main]
    paths:
      - images/vllm-runpod/Dockerfile
      - images/vllm-runpod/start-ssh.sh

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: runtime-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-runpod-vllm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          docker system prune --all --force
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate immutable runtime candidate
        env:
          VLLM_VERSION: ${{ inputs.vllm_version || '0.22.0' }}
          VLLM_BASE_IMAGE: ${{ inputs.vllm_base_image || 'vllm/vllm-openai@sha256:0fec7ec5f3e6bc168e54899935fb0557da908a4832a1dbc88e2debcf2f889416' }}
        run: |
          [[ "$VLLM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.][A-Za-z0-9]+)*$ ]]
          [[ "$VLLM_BASE_IMAGE" =~ ^vllm/vllm-openai@sha256:[0-9a-f]{64}$ ]]
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/infercrane/vllm-runpod
          tags: |
            type=raw,value=v${{ inputs.vllm_version || '0.22.0' }}
            type=sha
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        id: build
        with:
          context: .
          file: images/vllm-runpod/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VLLM_VERSION=${{ inputs.vllm_version || '0.22.0' }}
            VLLM_BASE_IMAGE=${{ inputs.vllm_base_image || 'vllm/vllm-openai@sha256:0fec7ec5f3e6bc168e54899935fb0557da908a4832a1dbc88e2debcf2f889416' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Scan the published runtime image by digest
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: ghcr.io/infercrane/vllm-runpod@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          fail-build: true
          severity-cutoff: critical
          output-format: table
      - name: Attest the runtime image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/infercrane/vllm-runpod
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Make runtime image public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            /orgs/infercrane/packages/container/vllm-runpod \
            -f visibility=public
          test "$(gh api /orgs/infercrane/packages/container/vllm-runpod --jq .visibility)" = public
      - name: Record publication instructions
        if: always()
        run: |
          cat >>"$GITHUB_STEP_SUMMARY" <<'EOF'
          The image was built and pushed with immutable provenance. GitHub may
          require an organization package administrator to set the package to
          public once at:

          https://github.com/orgs/infercrane/packages/container/package/vllm-runpod/settings
          EOF
