name: Bug report
description: Report reproducible InferCrane behavior
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: What happened and what did you expect?}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction, description: Include commands, version, provider, compute mode, and sanitized events.}
    validations: {required: true}
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This report does not disclose a vulnerability or credential.
          required: true
