<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Provider-native serverless request lifecycle</title>
  <desc id="desc">A stable logical endpoint receives a cold request at zero workers, the provider allocates a worker, the runtime becomes ready, a warm request completes, and provider idle policy returns capacity to zero.</desc>
  <style>:root{color-scheme:light dark}.bg{fill:#faf9f6}.card{fill:#fff;stroke:#dcdfe5}.name{font:600 17px 'Space Grotesk',system-ui;fill:#16181b}.small{font:500 11px ui-monospace,monospace;fill:#626a73;letter-spacing:.06em}.detail{font:400 13px 'Space Grotesk',system-ui;fill:#626a73}.track{stroke:#a8afb8;stroke-width:3;fill:none}.blue{stroke:#2563eb}.packet{fill:#2563eb;animation:cycle 7s ease-in-out infinite}.green{fill:#18a98c}.zero{fill:#626a73}@keyframes cycle{0%{transform:translateX(0);opacity:0}5%{opacity:1}22%{transform:translateX(200px)}42%{transform:translateX(410px)}62%{transform:translateX(620px)}82%{transform:translateX(820px)}95%{transform:translateX(1030px);opacity:1}100%{transform:translateX(1030px);opacity:0}}@media(prefers-color-scheme:dark){.bg{fill:#0b0d0f}.card{fill:#111418;stroke:#29313a}.name{fill:#f3f1ea}.small,.detail{fill:#9ca3ad}.track{stroke:#67717e}.blue{stroke:#60a5fa}.packet{fill:#60a5fa}.green{fill:#44d7b6}.zero{fill:#9ca3ad}}@media(prefers-reduced-motion:reduce){.packet{animation:none}}</style>
  <rect class="bg" width="1200" height="390" rx="20"/>
  <text class="small" x="55" y="55">SERVERLESS · PROVIDER-NATIVE WORKER SCHEDULING</text>
  <path class="track blue" d="M85 190H1115"/><circle class="packet" cx="85" cy="190" r="8"/>
  <rect class="card" x="55" y="105" width="170" height="170" rx="12"/><text class="small" x="78" y="138">01 · ZERO</text><text class="name" x="78" y="174">0 workers</text><text class="detail" x="78" y="210">stable InferCrane</text><text class="detail" x="78" y="232">logical endpoint</text><circle class="zero" cx="193" cy="133" r="6"/>
  <rect class="card" x="255" y="105" width="170" height="170" rx="12"/><text class="small" x="278" y="138">02 · REQUEST</text><text class="name" x="278" y="174">Cold arrival</text><text class="detail" x="278" y="210">gateway records</text><text class="detail" x="278" y="232">available evidence</text>
  <rect class="card" x="455" y="105" width="170" height="170" rx="12"/><text class="small" x="478" y="138">03 · PROVIDER</text><text class="name" x="478" y="174">Allocate</text><text class="detail" x="478" y="210">Provider owns queue</text><text class="detail" x="478" y="232">and GPU scheduling</text>
  <rect class="card" x="655" y="105" width="170" height="170" rx="12"/><text class="small" x="678" y="138">04 · READY</text><text class="name" x="678" y="174">Runtime worker</text><text class="detail" x="678" y="210">stream first token</text><text class="detail" x="678" y="232">through gateway</text><circle class="green" cx="793" cy="133" r="6"/>
  <rect class="card" x="855" y="105" width="170" height="170" rx="12"/><text class="small" x="878" y="138">05 · WARM</text><text class="name" x="878" y="174">Next request</text><text class="detail" x="878" y="210">reuse available</text><text class="detail" x="878" y="232">provider worker</text><circle class="green" cx="993" cy="133" r="6"/>
  <rect class="card" x="1055" y="105" width="90" height="170" rx="12"/><text class="small" x="1075" y="138">06</text><text class="name" x="1075" y="174">Idle</text><text class="detail" x="1075" y="210">back</text><text class="detail" x="1075" y="232">to zero</text>
  <text class="small" x="55" y="333">INFERCRANE DOES NOT POLL READINESS · POLLING COULD CREATE OR RETAIN A WARM WORKER</text>
</svg>
