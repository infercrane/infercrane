<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Deterministic Release Guard evaluation</title>
  <desc id="desc">Active and candidate revisions provide comparable persisted evidence. Deterministic policy returns wait, reject, or accept. Only an accepted ready candidate may be promoted.</desc>
  <style>:root{color-scheme:light dark}.bg{fill:#faf9f6}.card{fill:#fff;stroke:#dcdfe5}.name{font:600 19px 'Space Grotesk',system-ui;fill:#16181b}.small{font:500 12px ui-monospace,monospace;fill:#626a73;letter-spacing:.06em}.metric{font:400 14px 'Space Grotesk',system-ui;fill:#626a73}.line{stroke:#7b8490;stroke-width:2;fill:none}.blue{stroke:#2563eb}.token{fill:#2563eb;animation:guard 3.6s ease-in-out infinite}.ok{fill:#18a98c}.warn{fill:#f5b942}.bad{fill:#d6384c}.ring{fill:none;stroke:#2563eb;stroke-width:2;animation:ring 2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes guard{0%{transform:translateX(0);opacity:0}10%{opacity:1}45%{transform:translateX(250px)}75%{transform:translateX(510px)}100%{transform:translateX(755px);opacity:0}}@keyframes ring{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(1.8)}}@media(prefers-color-scheme:dark){.bg{fill:#0b0d0f}.card{fill:#111418;stroke:#29313a}.name{fill:#f3f1ea}.small,.metric{fill:#9ca3ad}.line{stroke:#67717e}.blue,.ring{stroke:#60a5fa}.token{fill:#60a5fa}.ok{fill:#44d7b6}.bad{fill:#ff5667}}@media(prefers-reduced-motion:reduce){.token,.ring{animation:none}}</style>
  <rect class="bg" width="1200" height="430" rx="20"/>
  <text class="small" x="55" y="55">RELEASE GUARD · PERSISTED + AUDITABLE</text>
  <rect class="card" x="55" y="90" width="240" height="230" rx="12"/><text class="small" x="82" y="125">ACTIVE · REV-18</text><text class="name" x="82" y="160">Known baseline</text><text class="metric" x="82" y="205">readiness</text><text class="metric" x="82" y="235">TTFT · latency</text><text class="metric" x="82" y="265">errors · throughput</text><circle class="ok" cx="263" cy="120" r="6"/>
  <rect class="card" x="355" y="90" width="240" height="230" rx="12"/><text class="small" x="382" y="125">CANDIDATE · REV-19</text><text class="name" x="382" y="160">Explicit evidence</text><text class="metric" x="382" y="205">same workload</text><text class="metric" x="382" y="235">same AIPerf version</text><text class="metric" x="382" y="265">immutable revision</text><circle class="warn" cx="563" cy="120" r="6"/>
  <rect class="card" x="655" y="90" width="240" height="230" rx="12"/><text class="small" x="682" y="125">DETERMINISTIC POLICY</text><text class="name" x="682" y="160">Compare limits</text><text class="metric" x="682" y="205">minimum requests</text><text class="metric" x="682" y="235">maximum regressions</text><text class="metric" x="682" y="265">persist reason codes</text>
  <rect class="card" x="955" y="90" width="190" height="68" rx="10"/><circle class="warn" cx="982" cy="124" r="6"/><text class="name" x="1003" y="131">WAIT</text>
  <rect class="card" x="955" y="176" width="190" height="68" rx="10"/><circle class="bad" cx="982" cy="210" r="6"/><text class="name" x="1003" y="217">REJECT</text>
  <rect class="card" x="955" y="262" width="190" height="68" rx="10"/><circle class="ok" cx="982" cy="296" r="6"/><text class="name" x="1003" y="303">ACCEPT</text><circle class="ring" cx="982" cy="296" r="9"/>
  <path class="line blue" d="M295 205H355M595 205H655M895 205H930M930 124V296M930 124H955M930 210H955M930 296H955"/><circle class="token" cx="310" cy="205" r="6"/>
  <text class="small" x="55" y="382">NO LLM DECISION · NO SILENT REQUEST DUPLICATION · MISSING EVIDENCE STAYS MISSING</text>
</svg>
