<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">InferCrane control plane and inference data plane</title>
  <desc id="desc">The CLI writes durable intent through the control API and PostgreSQL. Reconciliation manages registered provider and runtime adapters. OpenAI requests use an in-memory route snapshot and do not read PostgreSQL.</desc>
  <style>
    :root{color-scheme:light dark}.bg{fill:#faf9f6}.panel{fill:#fff;stroke:#dcdfe5}.line{stroke:#7b8490;stroke-width:2;fill:none}.dash{stroke-dasharray:7 7}.label{font:600 13px ui-monospace,SFMono-Regular,monospace;letter-spacing:.08em;fill:#626a73}.name{font:600 18px 'Space Grotesk',system-ui,sans-serif;fill:#16181b}.detail{font:400 13px 'Space Grotesk',system-ui,sans-serif;fill:#626a73}.blue{stroke:#2563eb}.bluefill{fill:#2563eb}.green{fill:#18a98c}.packet{fill:#60a5fa;animation:travel 3.4s linear infinite}.intent{fill:#2563eb;animation:intent 4.2s linear infinite}.pulse{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(730px);opacity:0}}@keyframes intent{0%{transform:translate(0,0);opacity:0}10%{opacity:1}45%{transform:translate(270px,0)}75%{transform:translate(270px,185px)}100%{transform:translate(530px,185px);opacity:0}}@keyframes pulse{0%{opacity:.9;transform:scale(.75)}70%,100%{opacity:0;transform:scale(2.2)}}@media(prefers-color-scheme:dark){.bg{fill:#0b0d0f}.panel{fill:#111418;stroke:#29313a}.label,.detail{fill:#9ca3ad}.name{fill:#f3f1ea}.line{stroke:#67717e}.blue{stroke:#60a5fa}.bluefill,.intent{fill:#60a5fa}.green{fill:#44d7b6}}@media(prefers-reduced-motion:reduce){.packet,.intent,.pulse{animation:none}}
  </style>
  <rect class="bg" width="1200" height="620" rx="20"/>
  <text class="label" x="55" y="58">CONTROL PLANE · DURABLE</text>
  <rect class="panel" x="55" y="85" width="205" height="105" rx="10"/>
  <text class="name" x="82" y="126">InferCrane CLI</text><text class="detail" x="82" y="153">desired state + operations</text>
  <rect class="panel" x="330" y="85" width="215" height="105" rx="10"/>
  <text class="name" x="357" y="126">Control API</text><text class="detail" x="357" y="153">auth · validation · events</text>
  <rect class="panel" x="615" y="85" width="215" height="105" rx="10"/>
  <text class="name" x="642" y="126">PostgreSQL</text><text class="detail" x="642" y="153">source of truth</text>
  <rect class="panel" x="900" y="85" width="245" height="105" rx="10"/>
  <text class="name" x="927" y="126">Operation worker</text><text class="detail" x="927" y="153">leased · resumable · replay-safe</text>
  <path class="line blue" d="M260 137H330M545 137H615M830 137H900"/><circle class="intent" cx="275" cy="137" r="6"/>
  <path class="line dash" d="M1022 190V290"/><text class="label" x="927" y="248">PROVIDER BOUNDARY</text>
  <rect class="panel" x="900" y="290" width="245" height="105" rx="10"/>
  <text class="name" x="927" y="332">Provider adapters</text><text class="detail" x="927" y="359">elastic + serverless APIs</text>
  <path class="line dash" d="M722 190V290"/>
  <rect class="panel" x="615" y="290" width="215" height="105" rx="10"/>
  <text class="name" x="642" y="332">Reconciler</text><text class="detail" x="642" y="359">health · model · routes</text>

  <line x1="55" y1="430" x2="1145" y2="430" stroke="#59626e" stroke-width="1" stroke-dasharray="3 8"/>
  <text class="label" x="55" y="474">DATA PLANE · DATABASE-FREE ROUTING</text>
  <rect class="panel" x="55" y="500" width="205" height="82" rx="10"/>
  <text class="name" x="82" y="535">OpenAI client</text><text class="detail" x="82" y="559">logical model alias</text>
  <rect class="panel" x="330" y="500" width="215" height="82" rx="10"/>
  <text class="name" x="357" y="535">Gateway</text><text class="detail" x="357" y="559">atomic route snapshot</text>
  <rect class="panel" x="615" y="500" width="215" height="82" rx="10"/>
  <text class="name" x="642" y="535">Replica router</text><text class="detail" x="642" y="559">instance-owned generation</text>
  <rect class="panel" x="900" y="500" width="245" height="82" rx="10"/>
  <text class="name" x="927" y="535">Runtime replicas</text><text class="detail" x="927" y="559">healthy standalone workers</text>
  <path class="line blue" d="M260 541H330M545 541H615M830 541H900"/><circle class="packet" cx="275" cy="541" r="6"/>
  <path class="line dash" d="M722 395V500M830 342H868V455H1022V500"/>
  <circle class="green" cx="1114" cy="526" r="6"/><circle class="green pulse" cx="1114" cy="526" r="6"/>
</svg>
